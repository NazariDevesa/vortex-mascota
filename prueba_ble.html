<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba Bluetooth Vortex</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #222; }
  button { font-size: 18px; padding: 10px 16px; margin: 4px; border-radius: 10px; border: 1px solid #888; }
  #registro { white-space: pre-wrap; font-family: monospace; background: #f3f3f3; padding: 8px;
              border-radius: 8px; height: 50vh; overflow-y: auto; }
</style>
</head>
<body>
<h1>Prueba Bluetooth Vortex <small>(versión 3)</small></h1>
<button id="conectar">Conectar</button>
<button data-letra="r">Rojo</button>
<button data-letra="v">Verde</button>
<button data-letra="a">Azul</button>
<p id="registro"></p>
<script>
// Servicio serie del Bluno (DFRobot): dfb0, característica dfb1 para los datos y
// dfb2 para la configuración (contraseña y velocidad).
// UUID completos: Bluefy no siempre entiende los cortos (0xdfb0).
const SERVICIO = '0000dfb0-0000-1000-8000-00805f9b34fb',
      SERIE    = '0000dfb1-0000-1000-8000-00805f9b34fb',
      ORDENES  = '0000dfb2-0000-1000-8000-00805f9b34fb';
const registro = document.getElementById('registro');
let serie = null;

function anotar(texto) {
  registro.textContent += texto + '\n';
  registro.scrollTop = registro.scrollHeight;
}

// Describe un error con todo lo que traiga (en Bluefy a veces no trae `message`).
function describir(e) {
  if (!e) return String(e);
  return [e.name, e.message, e.code, String(e)].filter(x => x !== undefined && x !== '').join(' | ');
}

// Escribe sin esperar respuesta si el navegador lo permite (Bluefy puede no tenerlo).
async function escribir(car, texto) {
  const datos = new TextEncoder().encode(texto);
  if (car.writeValueWithoutResponse) return car.writeValueWithoutResponse(datos);
  return car.writeValue(datos);
}

document.getElementById('conectar').onclick = async () => {
  let paso = 'buscar el robot';
  try {
    const disp = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'Vortex' }], optionalServices: [SERVICIO] });
    paso = 'conectar';
    const servidor = await disp.gatt.connect();
    paso = 'abrir el servicio';
    const servicio = await servidor.getPrimaryService(SERVICIO);
    serie = await servicio.getCharacteristic(SERIE);
    const ordenes = await servicio.getCharacteristic(ORDENES);
    paso = 'configurar';
    await escribir(ordenes, 'AT+PASSWOR=DFRobot\r\n');
    await escribir(ordenes, 'AT+CURRUART=9600\r\n');
    anotar('Conectado a ' + disp.name);
    const dec = new TextDecoder();
    serie.addEventListener('characteristicvaluechanged',
      e => anotar('RECIBIDO: ' + dec.decode(e.target.value)));
    try {
      await serie.startNotifications();
      anotar('Avisos activados: esperando "hola N" del robot...');
    } catch (e) {
      anotar('No se pueden activar los avisos: ' + describir(e));
    }
  } catch (e) {
    anotar('Error al ' + paso + ': ' + describir(e));
  }
};

for (const boton of document.querySelectorAll('[data-letra]')) {
  boton.onclick = async () => {
    if (!serie) { anotar('Primero conecta'); return; }
    try {
      await escribir(serie, boton.dataset.letra);
      anotar('ENVIADO: ' + boton.dataset.letra);
    } catch (e) {
      anotar('Error al enviar: ' + describir(e));
    }
  };
}

anotar('Versión 3 cargada. Navegador: ' + navigator.userAgent);
if (!navigator.bluetooth) {
  anotar('Este navegador no tiene Bluetooth web. Usa Chrome o Edge (en iPad, Bluefy).');
}
</script>
</body>
</html>
